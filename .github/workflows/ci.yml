name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    name: Backend Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/python-path@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi uvicorn sqlalchemy pydantic python-jose passlib bcrypt redis alembic requests

      - name: Security Scan & Dependency Audit
        run: |
          pip install safety || true
          safety check || echo "Dependency audit finished with warnings"

      - name: Alembic Migration Validation
        run: |
          python scripts/validate_migrations.py

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-validation-12345
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          python -m pytest --maxfail=3 --disable-warnings

  frontend-test-and-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Frontend Bundle
        run: npm run build

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || echo "NPM audit completed with advisories"

  docker-build-check:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test-and-lint, frontend-test-and-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: seo-agent-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: seo-agent-frontend:ci
