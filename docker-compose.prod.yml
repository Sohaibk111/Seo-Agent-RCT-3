version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seo_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_agent_prod}
      POSTGRES_USER: ${POSTGRES_USER:-seo_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_prod_user} -d ${POSTGRES_DB:-seo_agent_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seo_redis_prod
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_prod_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seo_backend_prod
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seo_agent_prod}
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 40
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: 120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seo_worker_prod
    restart: always
    command: python3 -m backend.worker
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seo_agent_prod}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: seo_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
