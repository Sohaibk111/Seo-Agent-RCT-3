version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seo_agent_db
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d seo_agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seo_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://seo_user:seo_secure_password_123@postgres:5432/seo_agent_db
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      JWT_SECRET_KEY: super-secret-jwt-key-for-development-mode-12345
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seo_worker
    restart: unless-stopped
    command: python3 -m backend.worker
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://seo_user:seo_secure_password_123@postgres:5432/seo_agent_db
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      JWT_SECRET_KEY: super-secret-jwt-key-for-development-mode-12345
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: seo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
