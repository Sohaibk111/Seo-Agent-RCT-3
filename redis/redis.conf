# Redis Production Configuration
bind 0.0.0.0
port 6379
protected-mode no

# Persistence Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

save 900 1
save 300 10
save 60 10000

# Memory Management
maxmemory 512mb
maxmemory-policy volatile-lru

# Security & Performance
timeout 0
tcp-keepalive 300
loglevel notice
